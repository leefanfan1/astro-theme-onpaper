<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F4F5F7"/>
  <!-- The site name stands upright, as on the page spine. -->
  <g fill="#182134" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="118" font-weight="900" text-anchor="middle">
    <text x="190" y="178">纸</text>
    <text x="190" y="304">上</text>
    <text x="190" y="430">留</text>
    <text x="190" y="556">白</text>
  </g>
  <path d="M330 74V556" stroke="#2A47C9" stroke-width="3"/>
  <text x="400" y="250" fill="#182134" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="46" font-weight="700">在字与字之间，留一点呼吸。</text>
  <text x="400" y="330" fill="#4A5368" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28">一个关于随笔、音乐与城市夜色的个人博客。</text>
  <text x="400" y="376" fill="#4A5368" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28">把说不清楚的事写下来，给日子留一点空白。</text>
  <text x="400" y="550" fill="#626B7E" font-family="'Newsreader', Georgia, serif" font-size="26">onpaper.example.com</text>
</svg>
